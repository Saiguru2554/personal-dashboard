name: AI Scraper Agent Cron

on:
  schedule:
    - cron: '0 0,12 * * *'  # Runs every 12 hours automatically
  workflow_dispatch:        # Allows manual run from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-genai requests
          playwright install chromium

      - name: Run Scraper Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APPS_SCRIPT_WEBHOOK: ${{ secrets.APPS_SCRIPT_WEBHOOK }}
          SESSION_STATE_BASE64: ${{ secrets.SESSION_STATE_BASE64 }}
        run: python agent_scraper.py